[project]
name = "taskdistill"
version = "0.1.1"
description = "Distil an expensive LLM API call on a narrow task into a small local model served behind an OpenAI-compatible cascade."
dynamic = ["readme"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrii Boiko" }]
requires-python = ">=3.12"
keywords = ["llm", "distillation", "lora", "mlx", "cascade", "calibration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "datasketch>=2.0",
  "matplotlib>=3.8",
  "prometheus-client>=0.20",
  "rich>=13",
  "huggingface-hub>=0.23",
  "transformers>=5,<6",
  "jinja2>=3.1",
  "jsonschema>=4.21",
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "peft>=0.11"]
hub = ["pyarrow>=15"]

[project.scripts]
taskdistill = "taskdistill.cli:main"

[project.urls]
Homepage = "https://github.com/B0yko/taskdistill"
Issues = "https://github.com/B0yko/taskdistill/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

# PyPI does not resolve the README's relative links: point them at the tagged sources on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)\s]+\.(?:png|svg))\)'
replacement = '](https://raw.githubusercontent.com/B0yko/taskdistill/v0.1.1/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/B0yko/taskdistill/blob/v0.1.1/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#([^)\s]+)\)'
replacement = '](https://github.com/B0yko/taskdistill/blob/v0.1.1/README.md#\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/taskdistill"]

[tool.hatch.build.targets.sdist]
include = ["src/taskdistill", "tests", "scripts", "examples", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not mlx' --strict-markers"
markers = [
  "mlx: needs Apple Silicon with Metal (local only; run with -m mlx)",
  "network: fetches public data (GitHub, Hugging Face); never a paid API",
  "slow: takes more than a few seconds",
]
timeout = 600

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "PTH123", "SIM108"]

[tool.mypy]
python_version = "3.12"
files = ["src/taskdistill"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["taskdistill.evaluate.*", "taskdistill.ledger", "taskdistill.confidence"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
  "mlx.*", "mlx_lm.*", "datasketch.*", "sklearn.*", "torch.*", "peft.*", "unsloth.*",
  "transformers.*", "pyarrow.*", "matplotlib.*", "prometheus_client.*",
]
ignore_missing_imports = true
