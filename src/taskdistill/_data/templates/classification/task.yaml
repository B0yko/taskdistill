task: "__TASK__"                # 1-64 letters, digits, '.', '_' or '-'
type: classification            # classification | extraction
labels_file: labels.txt         # classification only: one label per line
schema_file: null               # extraction only
input:                          # how the task input is found in each request
  from: last_user_message       # or: regex
  regex: null                   # named group "input" when from: regex
teacher:                        # the API model whose calls are distilled
  base_url: ${TASKDISTILL_TEACHER_BASE_URL:-https://openrouter.ai/api/v1}  # any OpenAI-compatible endpoint
  api_key_env: TASKDISTILL_TEACHER_API_KEY   # falls back to OPENROUTER_API_KEY
  model: ${TASKDISTILL_TEACHER_MODEL:-deepseek/deepseek-v4.1-flash}  # the slug your application calls today; check its terms allow training on outputs
  prompt_file: teacher_prompt.md  # system prompt sent to the teacher, verbatim
  temperature: 0                # keep 0 so labels are reproducible
  max_tokens: 24                # room for one label
  response_format: null         # keep null: the teacher must answer with a bare label
  extra_body: {}                # e.g. {provider: {order: [<provider>], allow_fallbacks: false}} to pin one
student:                        # the small local model
  base_model: mlx-community/Qwen2.5-0.5B-Instruct-4bit   # Hugging Face id; --base overrides it
  system_prompt: "Classify the message into exactly one label."   # short prompt used in training and serving
  max_tokens: 16                # generation cap
  response_template: null       # e.g. '{"intent": "{label}"}'
train:                          # LoRA fine-tuning
  profile: full                 # quick | full
  lora_rank: 16                 # adapter rank
  lora_layers: all              # number of top layers to adapt, or all
  learning_rate: 1.0e-4         # optimiser step size
  batch_size: 8                 # examples per step
  epochs: 2                     # passes over the training split
  max_seq_len: 512              # longer examples are dropped, never truncated
  seed: 13                      # training seed
  lr_schedule: warmup_cosine    # warmup_cosine (linear warm-up, cosine decay) | constant
curate:                         # captured traffic -> train/valid/test
  dedupe:                       # applied inside each split, then across splits
    exact: true                 # exact match on the normalised input
    near_dup_jaccard: 0.9       # MinHash LSH threshold on word 3-shingles
  pii:                          # regex scrub with checksums, before dedupe
    enabled: true               # false keeps text as captured
    kinds: [email, phone, iban, card, ipv4, ssn]   # any subset
  split:                        # fractions apply only to rows without meta.split
    predefined: meta.split      # meta field holding train|valid|test, or null
    val: 0.1                    # validation fraction
    test: 0.1                   # test fraction
    stratify: true              # stratify by label
    group_by: null              # e.g. meta.customer keeps each group in one split
    seed: 13                    # split seed
cascade:                        # when the student answers and when the teacher does
  reference: teacher            # teacher | gold
  metric: agreement             # agreement | accuracy | macro_f1
  target: 0.97                  # or target: null, max_drop: 0.01, reference: gold, metric: accuracy
  max_drop: null                # max drop from the teacher's gold score; needs reference: gold
  on_teacher_error: student     # student | error
  escalation_response: canonical  # canonical | raw
cost:                           # local cost estimate for the report
  local_watts: 20               # power draw while serving
  usd_per_kwh: 0.30             # electricity price
  hardware_usd: 0               # hardware price to amortise; 0 disables
  amortisation_hours: 0         # hours to spread it over; 0 disables
budget:                         # teacher spend
  usd_cap: null                 # optional per-task cap; TASKDISTILL_BUDGET_USD always applies
